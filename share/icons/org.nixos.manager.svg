<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     role="img" aria-label="NixOS Manager — JR-IT Services">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C447C"/>
      <stop offset="1" stop-color="#042C53"/>
    </linearGradient>
  </defs>

  <!-- Rounded tile, JR-IT primary blue to ink. -->
  <rect width="100" height="100" rx="26" fill="url(#tile)"/>

  <!-- JR monogram. -->
  <text x="50" y="45" text-anchor="middle" dominant-baseline="central"
        font-family="Manrope, Arial, Helvetica, sans-serif" font-weight="700"
        font-size="40" letter-spacing="-2" fill="#E6F1FB">JR</text>

  <!-- Circuit traces running to the nodes. -->
  <g fill="none" stroke="#378ADD" stroke-width="2.6"
     stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <path d="M20 78 H38 V70"/>
    <path d="M50 78 V72"/>
    <path d="M80 78 H62 V70"/>
  </g>

  <!-- Amber nodes: the single warm accent. -->
  <g fill="#F4A93C">
    <circle cx="38" cy="68" r="3.4"/>
    <circle cx="62" cy="68" r="3.4"/>
  </g>
  <circle cx="50" cy="71" r="3.4" fill="#378ADD"/>
</svg>
