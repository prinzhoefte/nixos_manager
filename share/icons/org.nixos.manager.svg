<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     role="img" aria-label="NixOS Manager — JR-IT Services">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C447C"/>
      <stop offset="1" stop-color="#042C53"/>
    </linearGradient>
  </defs>

  <!-- Rounded tile, JR-IT primary blue to ink. -->
  <rect width="100" height="100" rx="23" fill="url(#tile)"/>

  <!-- JR monogram. -->
  <text x="50" y="40" text-anchor="middle" dominant-baseline="central"
        font-family="Manrope, Inter, Cantarell, Arial, Helvetica, sans-serif"
        font-weight="700" font-size="38" letter-spacing="-1.5" fill="#E6F1FB">JR</text>

  <!-- Circuit traces running out to the nodes. -->
  <g fill="none" stroke="#378ADD" stroke-width="2.9"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 78 H38 V70"/>
    <path d="M50 78 V73"/>
    <path d="M81 78 H62 V70"/>
  </g>

  <!-- Amber nodes: the single warm accent. -->
  <g fill="#F4A93C">
    <circle cx="38" cy="66.6" r="3.7"/>
    <circle cx="62" cy="66.6" r="3.7"/>
  </g>
  <circle cx="50" cy="69.8" r="3.7" fill="#378ADD"/>
</svg>
